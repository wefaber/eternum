<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGRSI — Inventario</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/pages/inventario/inventario.css">
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="../../assets/img/logo.png" alt="Logo SGRSI" class="sidebar-logo">
      <span class="sidebar-nombre">Lux</span>
    </div>

    <nav class="sidebar-nav" aria-label="Navegación principal">
      <ul>
        <li><a href="../dashboard/dashboard.html" class="nav-link">
          <svg class="nav-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5"/><path d="M9 22V12h6v10"/></svg> Inicio
        </a></li>
        <li><a href="../inventario/inventario.html" class="nav-link activo">
          <svg class="nav-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73L12 3 4 6.27A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73L12 21l8-3.27A2 2 0 0 0 21 16z"/><path d="M7 9.5l10 4"/></svg> Inventario
        </a></li>
        <li><a href="../equipment-status/equipment-status.html" class="nav-link">
          <svg class="nav-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg> Estado de Equipos
        </a></li>
        <li><a href="../tickets/tickets.html" class="nav-link">
          <svg class="nav-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10v4a2 2 0 0 1-2 2h-1"/><path d="M3 10v4a2 2 0 0 0 2 2h1"/><path d="M7 12h10"/></svg> Tickets
        </a></li>
        <li><a href="../prestamos/prestamos.html" class="nav-link">
          <svg class="nav-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v14"/><path d="M7 7h10"/></svg> Préstamos
        </a></li>
        <li><a href="../solicitudes/solicitudes.html" class="nav-link">
          <svg class="nav-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 12.3a4 4 0 1 0-5.6 5.6l5.6-5.6z"/><path d="M20 14v7h-7"/></svg> Solicitudes
        </a></li>
        <li><a href="../profile/profile.html" class="nav-link">
          <svg class="nav-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Perfil
        </a></li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-colapsar" id="btn-colapsar" type="button">‹ Colapsar</button>
    </div>
  </aside>

  <div class="layout">

    <header class="topbar">
      <div class="topbar-controles">
        <button class="ctrl-fuente" type="button" data-size="small">A</button>
        <button class="ctrl-fuente activo" type="button" data-size="medium">A</button>
        <button class="ctrl-fuente" type="button" data-size="large">A</button>
        <button class="ctrl-tema" type="button" id="btn-tema" aria-label="Cambiar tema">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
      <div class="topbar-usuario">
        <div class="usuario-avatar">MR</div>
        <div class="usuario-info">
          <span class="usuario-nombre">Marcela</span>
          <span class="usuario-rol">Administrador</span>
        </div>
      </div>
    </header>

    <main class="main-content">

      <section class="encabezado-pagina" aria-label="Encabezado de inventario">
        <div>
          <h1>Inventario</h1>
          <p class="subtitulo">Equipos y componentes del instituto</p>
        </div>
        <div class="acciones-encabezado">
          <a href="../componentes/nuevo-componente.html" class="btn-secundario">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg>
            Componente
          </a>
          <a href="../equipos/nuevo-equipo.html" class="btn-primario">+ Nuevo equipo</a>
        </div>
      </section>

      <section class="filtros-inventario" aria-label="Filtros de inventario">
        <input type="text" class="input-busqueda" placeholder="Buscar por marca, modelo, serie...">

        <select class="select-filtro" name="estado">
          <option value="">Todos los estados</option>
          <option value="operativo">Operativo</option>
          <option value="reparacion">En reparación</option>
          <option value="baja">De baja</option>
        </select>

        <select class="select-filtro" name="ubicacion">
          <option value="">Todas las ubicaciones</option>
          <option value="lab1">Laboratorio 1</option>
          <option value="lab2">Laboratorio 2</option>
          <option value="salones">Salones</option>
          <option value="administracion">Administración</option>
        </select>
      </section>

      <section class="tabs-inventario" aria-label="Pestañas de inventario">
        <!-- JS: alternar contenido visible entre Equipos y Componentes -->
        <button class="tab-btn activo" type="button" data-tab="equipos">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73L12 3 4 6.27A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73L12 21l8-3.27A2 2 0 0 0 21 16z"/><path d="M7 9.5l10 4"/></svg>
          Equipos (0)
        </button>
        <button class="tab-btn" type="button" data-tab="componentes">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg>
          Componentes (0)
        </button>
      </section>

      <section class="contenido-tab" id="tab-equipos">
        <p class="mensaje-vacio">No se encontraron equipos</p>
        <!-- JS: aquí se renderiza la tabla/grid de equipos cuando haya datos -->
      </section>

      <section class="contenido-tab oculto" id="tab-componentes">
        <p class="mensaje-vacio">No se encontraron componentes</p>
        <!-- JS: aquí se renderiza la tabla/grid de componentes cuando haya datos -->
      </section>

    </main>
  </div>

</body>
</html>
