    <div class="sidebar-brand">
      <img src="../../assets/img/logo.png" alt="Logo SGRSI" class="sidebar-logo">
      <span class="sidebar-nombre">Lux</span>
    </div>
    <nav class="sidebar-nav" aria-label="Navegación principal">
      <ul>
        <li><a href="../dashboard/dashboard.html" class="nav-link">
          <svg class="nav-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5"/><path d="M9 22V12h6v10"/></svg> Inicio
        </a></li>
        <li><a href="../inventario/inventario.html" class="nav-link activo">
          <svg class="nav-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73L12 3 4 6.27A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73L12 21l8-3.27A2 2 0 0 0 21 16z"/><path d="M7 9.5l10 4"/></svg> Inventario
        </a></li>
        <li><a href="../equipment-status/equipment-status.html" class="nav-link">
          <svg class="nav-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg> Estado de Equipos
        </a></li>
        <li><a href="../tickets/tickets.html" class="nav-link">
          <svg class="nav-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10v4a2 2 0 0 1-2 2h-1"/><path d="M3 10v4a2 2 0 0 0 2 2h1"/><path d="M7 12h10"/></svg> Tickets
        </a></li>
        <li><a href="../prestamos/prestamos.html" class="nav-link">
          <svg class="nav-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v14"/><path d="M7 7h10"/></svg> Préstamos
        </a></li>
        <li><a href="../solicitudes/solicitudes.html" class="nav-link">
          <svg class="nav-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 12.3a4 4 0 1 0-5.6 5.6l5.6-5.6z"/><path d="M20 14v7h-7"/></svg> Solicitudes
        </a></li>
        <li><a href="../profile/profile.html" class="nav-link">
          <svg class="nav-icono" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Perfil
        </a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-colapsar" id="btn-colapsar" type="button">‹ Colapsar</button>
    </div>
  </aside>

  <div class="layout">

    <header class="topbar">
      <div class="topbar-controles">
        <button class="ctrl-fuente" type="button" data-size="small">A</button>
        <button class="ctrl-fuente activo" type="button" data-size="medium">A</button>
        <button class="ctrl-fuente" type="button" data-size="large">A</button>
        <button class="ctrl-tema" type="button" id="btn-tema" aria-label="Cambiar tema">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
      <div class="topbar-usuario">
        <div class="usuario-avatar">MR</div>
        <div class="usuario-info">
          <span class="usuario-nombre">Marcela</span>
          <span class="usuario-rol">Administrador</span>
        </div>
      </div>
    </header>

    <main class="main-content">

      <section class="encabezado-formulario" aria-label="Encabezado">
        <a href="../inventario/inventario.html" class="btn-volver">← Nuevo componente</a>
      </section>

      <section class="card formulario-card" aria-label="Formulario nuevo componente">
        <h2>Datos del componente</h2>

        <form class="formulario" action="#" method="post">

          <div class="fila-dos">
            <div class="campo">
              <label for="nombre-componente">Nombre del componente</label>
              <input type="text" id="nombre-componente" name="nombre_componente">
            </div>
            <div class="campo">
              <label for="modelo">Modelo</label>
              <input type="text" id="modelo" name="modelo">
            </div>
          </div>

          <div class="campo">
            <label for="fabricante">Fabricante</label>
            <input type="text" id="fabricante" name="fabricante">
          </div>

          <div class="fila-dos">
            <div class="campo">
              <label for="serie">N° de serie</label>
              <input type="text" id="serie" name="serie">
            </div>
            <div class="campo">
              <label for="part-number">Part number</label>
              <input type="text" id="part-number" name="part_number">
            </div>
          </div>

          <div class="fila-checks">
            <label class="check-label">
              <input type="checkbox" name="es_fabrica" checked>
              ¿Es de fábrica?
            </label>
            <label class="check-label">
              <input type="checkbox" name="funcionando" checked>
              ¿Está funcionando?
            </label>
          </div>

          <div class="acciones-formulario">
            <a href="../inventario/inventario.html" class="btn-secundario">Cancelar</a>
            <button type="submit" class="btn-primario">Guardar</button>
          </div>

        </form>
      </section>

    </main>
  </div>

</body>
</html>
